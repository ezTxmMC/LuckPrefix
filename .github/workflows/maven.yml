name: Java CI with Maven

permissions:
  contents: read

on:
  push:
    branches: [ "*/dev", "*/release" ]
  pull_request:
    branches: [ "feature/*", "feat/*", "fix/*", "patch/*" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '24', '23', '21' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Get non-legacy modules
        id: modules
        run: |
          # Find all pom.xml, exclude any in "legacy" dirs, get dir names
          MODULES=$(find . -name pom.xml -not -path "*/luckprefix-legacy/*" -exec dirname {} \; | grep -v '^\.$' | tr '\n' ',' | sed 's/,$//')
          echo "MODULES=$MODULES" >> $GITHUB_ENV

      - name: Build with Maven (skip legacy)
        run: |
          if [ -z "$MODULES" ]; then
            echo "No non-legacy modules found, skipping build."
          else
            mvn -B clean install --file pom.xml -pl $MODULES -am
          fi

      - name: Run tests with Maven (skip legacy)
        run: |
          if [ -z "$MODULES" ]; then
            echo "No non-legacy modules found, skipping tests."
          else
            mvn test -pl $MODULES -am
          fi
