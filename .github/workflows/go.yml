name: Go

on:
  push:
    branches: [ "2.0/dev" ]
  pull_request:
    branches: [ "2.0/dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        run: go build -v main.go
        working-directory: luckprefix-updater

      - name: Test
        run: go test -v ./...
        working-directory: luckprefix-updater
